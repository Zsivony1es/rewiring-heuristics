### This file contains all different properties, which can be toggled in the application
### Just uncomment/change the value of the setting you require

### Explicitly setting a property when calling the app from the command line
### will override the value set in this file for that property!

### The corresponding CLI tag is the property name in camel case preceeded by two dashes
### e.g. model.type -> --modelType

### Set the model
# model.type=GCN
# model.type=GIN
model.type=GAT

### Set whether the application should generate plot images ( will be saved in Source/out )
# generate.plots=True
# generate.plots=False